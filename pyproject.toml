[project]
name = "diary-mcp"
version = "0.15.2"
description = "MCP server for project diary + Claude memory tree — backed by PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.28.0,<2",
    "psycopg[binary]>=3.1",
    "fastapi[standard]>=0.115",
    "uvicorn>=0.34",
    "fastembed>=0.4",
    "pynacl>=1.5",
    "httpx>=0.27",
]

[project.scripts]
diary-mcp       = "diary_server:main"
diary-admin-mcp = "diary_admin_server:main"
diary-web       = "diary_web:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[tool.setuptools]
py-modules = [
    "diary_server", "diary_bootstrap", "diary_project_tools", "memory_service",
    "search_engine", "graph_core", "graph_admin", "diary_admin_bootstrap",
    "diary_admin_server", "sync_manager", "diary_link",
    "diary_db", "diary_config", "diary_logger", "diary_http_receiver", "diary_web", "diary_embed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
