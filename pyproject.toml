[project]
name = "diary-mcp"
version = "0.4.4"
description = "MCP server for project diary + Claude memory tree — backed by PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.28.0",
    "psycopg[binary]>=3.1",
    "fastapi[standard]>=0.115",
    "uvicorn>=0.34",
    "fastembed>=0.4",
]

[project.scripts]
diary-mcp      = "diary_server:main"
diary-web      = "diary_web:main"

[tool.setuptools]
py-modules = ["diary_server", "diary_db", "diary_config", "diary_logger", "diary_http_receiver", "diary_web", "diary_embed"]
